name: Windows Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.0.x'
    
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          !build/Runtime
        key: ${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ matrix.build_type }}-
          ${{ runner.os }}-cmake-
    
    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTI_BUILD_SHARED=OFF
    
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }} --parallel
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TitanEngine-Windows-${{ matrix.build_type }}
        path: |
          Runtime/*.exe
          Runtime/*.dll
          Runtime/assets/
          Runtime/mono/
          Runtime/resources/
        retention-days: 7
